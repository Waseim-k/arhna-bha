name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: android

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk arhna-bha.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arhna-bha-apk
          path: arhna-bha.apk

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "أرحنا بها — أحدث APK"
          body: "آخر بناء تلقائي لتطبيق أرحنا بها. نزّل arhna-bha.apk وثبّته على هاتفك."
          files: arhna-bha.apk
