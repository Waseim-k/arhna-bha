<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffe9db"/>
      <stop offset="0.45" stop-color="#ffd9e2"/>
      <stop offset="1" stop-color="#e7ddf5"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd59e"/>
      <stop offset="1" stop-color="#ffb9c6"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4657f"/>
      <stop offset="1" stop-color="#b24e6c"/>
    </linearGradient>
    <clipPath id="round"><rect x="0" y="0" width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#dawn)"/>
    <!-- dawn sun on horizon -->
    <circle cx="256" cy="330" r="150" fill="url(#sun)" opacity="0.55"/>
    <!-- minarets -->
    <g fill="url(#rose)">
      <rect x="120" y="150" width="20" height="210" rx="10"/>
      <path d="M130 130c14 0 20 12 20 22H110c0-10 6-22 20-22z"/>
      <circle cx="130" cy="120" r="9"/>
      <rect x="372" y="150" width="20" height="210" rx="10"/>
      <path d="M382 130c14 0 20 12 20 22h-40c0-10 6-22 20-22z"/>
      <circle cx="382" cy="120" r="9"/>
      <!-- central dome -->
      <path d="M256 150c-44 0-78 34-78 80v10h156v-10c0-46-34-80-78-80z"/>
      <rect x="178" y="240" width="156" height="135" rx="8"/>
      <!-- finial + crescent -->
      <rect x="251" y="104" width="10" height="46" rx="5"/>
      <path d="M256 70a30 30 0 1 0 22 50 24 24 0 1 1 0-40 30 30 0 0 0-22-10z"/>
      <!-- arched door -->
    </g>
    <path d="M236 375v-58c0-11 9-20 20-20s20 9 20 20v58z" fill="#fff" opacity="0.92"/>
    <!-- base line -->
    <rect x="150" y="372" width="212" height="16" rx="8" fill="url(#rose)"/>
  </g>
</svg>
